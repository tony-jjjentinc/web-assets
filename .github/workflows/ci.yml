name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      # nothing from npm is shipped (dist/ is generated files only), so the blocking audit covers production dependencies.
      # The full audit is informational: a high `braces` advisory in the Tailwind CLIs (test tooling) has no patched release yet.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
        continue-on-error: true
